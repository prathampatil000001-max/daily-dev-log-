
name: Daily Development Log

on:
  schedule:
    - cron: "30 4 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Daily Log
        run: |
          mkdir -p logs

          DATE=$(date '+%Y-%m-%d')
          TIME=$(date '+%H:%M:%S')

          echo "# Development Log - $DATE" > "logs/$DATE.md"
          echo "" >> "logs/$DATE.md"
          echo "Daily project documentation update." >> "logs/$DATE.md"
          echo "Updated at: $TIME IST" >> "logs/$DATE.md"

      - name: Commit and Push
        run: |
          git config user.name "prathampatil000001"
          git config user.email "312601398+prathampatil000001-max@users.noreply.github.com"

          git add logs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: daily development log"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
